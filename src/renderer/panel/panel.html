<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Remoto - sessione attiva</title>
    <link rel="stylesheet" href="../css/base.css" />
    <style>
      body { background: var(--surface); border: 1px solid var(--border-strong); }
      .panel { display: flex; flex-direction: column; }
      .titlebar { height: 40px; border-bottom: 1px solid var(--border); }
      .live { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13px; }
      .sess { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
      .sess-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .sess-top .n { font-weight: 650; }
      .sess-top .i { font-size: 12px; color: var(--text-3); font-family: var(--mono); }
      .dur { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--text-2); }
      .perm-bar { display: flex; flex-wrap: wrap; gap: 4px; }
      .perm-bar .icon-btn { width: 32px; height: 32px; border: 1px solid var(--border); }
      .perm-bar .icon-btn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
      .perm-bar .icon-btn.off { color: var(--text-3); }
      .chat { display: flex; flex-direction: column; min-height: 0; }
      .mic-line { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 6px 9px; border-radius: 9px; }
      .mic-line.ok { background: var(--success-soft); color: var(--success); }
      .mic-line.warn { background: var(--warning-soft); color: var(--warning); }
      .chat-list { max-height: 220px; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
      .bubble { max-width: 85%; padding: 6px 10px; border-radius: 12px; background: var(--surface-3); white-space: pre-wrap; word-wrap: break-word; user-select: text; font-size: 13px; }
      .bubble.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
      .bubble .who { display: block; font-size: 10.5px; font-weight: 700; opacity: .7; }
      .chat-form { display: flex; gap: 6px; padding: 10px 14px 12px; }
      .chat-form .input { height: 34px; }
    </style>
    <script type="module" src="./panel.js"></script>
  </head>
  <body>
    <div id="app" class="panel"></div>
  </body>
</html>
