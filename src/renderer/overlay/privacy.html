<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Remoto - privacy</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
      body { display: grid; place-items: center; font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #5b5f73; user-select: none; }
      .box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      svg { width: 44px; height: 44px; stroke: #3d4050; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      strong { color: #8a8ea3; font-weight: 600; font-size: 17px; }
    </style>
  </head>
  <body>
    <div class="box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
      <strong>Questo computer è controllato da remoto</strong>
      <span>Lo schermo è oscurato per la privacy della sessione Remoto.</span>
    </div>
  </body>
</html>
